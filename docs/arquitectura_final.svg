  <text x="682" y="117" text-anchor="middle" font-size="10">:5432 (interno)</text>
  <text x="682" y="138" text-anchor="middle" font-size="9" fill="#1b7a3a">health: pg_isready</text>
  <line x1="120" y1="115" x2="178" y2="115" stroke="#1b7a3a" stroke-width="1.8" marker-end="url(#b)"/>
  <text x="128" y="133" text-anchor="middle" font-size="9" fill="#1b7a3a">8080→80</text>
  <line x1="340" y1="115" x2="398" y2="115" stroke="#1b7a3a" stroke-width="1.8" marker-end="url(#b)"/>
  <text x="369" y="105" text-anchor="middle" font-size="9">HTTP</text>
  <line x1="560" y1="115" x2="618" y2="115" stroke="#1b7a3a" stroke-width="1.8" marker-end="url(#b)"/>
  <text x="589" y="105" text-anchor="middle" font-size="9">SQL</text>
  <path d="M682,170 L682,240" stroke="#13507c" stroke-width="1.5" marker-end="url(#b)"/>
