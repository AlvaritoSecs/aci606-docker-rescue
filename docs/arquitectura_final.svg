  <rect x="180" y="238" width="380" height="42" rx="6" fill="#fff" stroke="#bbb"/>
  <text x="370" y="255" text-anchor="middle" font-size="10">.env / .env.example → POSTGRES_USER, POSTGRES_PASSWORD,</text>
  <text x="370" y="270" text-anchor="middle" font-size="10">POSTGRES_DB, FRONTEND_PORT · restart: unless-stopped</text>
