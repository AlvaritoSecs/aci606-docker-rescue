<?xml version="1.0" encoding="UTF-8"?>
<svg style="background:#fff" viewBox="0 0 760 290" width="760" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Arial" font-size="12">
  <defs><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1b7a3a"/></marker></defs>
  <rect x="160" y="20" width="595" height="200" rx="10" fill="#f5faf6" stroke="#1b7a3a" stroke-dasharray="6,4"/>
