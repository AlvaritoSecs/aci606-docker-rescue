  <text x="260" y="138" text-anchor="middle" font-size="9" fill="#1b7a3a">health: wget 127.0.0.1/</text>
  <text x="260" y="154" text-anchor="middle" font-size="10" fill="#1b7a3a">espera backend healthy</text>
  <rect x="400" y="60" width="160" height="110" rx="8" fill="#eaf2fa" stroke="#13507c"/>
  <text x="480" y="84" text-anchor="middle" font-weight="bold">backend</text>
  <text x="480" y="101" text-anchor="middle" font-size="10">FastAPI · main:app · :8000</text>
  <text x="480" y="117" text-anchor="middle" font-size="10">DATABASE_URL desde .env</text>
  <text x="480" y="138" text-anchor="middle" font-size="9" fill="#1b7a3a">health: GET /health (+SELECT 1)</text>
  <text x="480" y="154" text-anchor="middle" font-size="10" fill="#1b7a3a">espera db healthy</text>
  <rect x="620" y="60" width="125" height="110" rx="8" fill="#eaf2fa" stroke="#13507c"/>
  <text x="682" y="84" text-anchor="middle" font-weight="bold">db</text>
