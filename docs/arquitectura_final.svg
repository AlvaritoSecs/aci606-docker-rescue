  <rect x="10" y="85" width="110" height="60" rx="8" fill="#fff" stroke="#888"/>
  <text x="65" y="112" text-anchor="middle">Navegador</text><text x="65" y="128" text-anchor="middle" font-size="10" fill="#666">(host)</text>
  <rect x="180" y="60" width="160" height="110" rx="8" fill="#eaf2fa" stroke="#13507c"/>
  <text x="260" y="84" text-anchor="middle" font-weight="bold">frontend</text>
  <text x="260" y="101" text-anchor="middle" font-size="10">nginx · :80</text>
